{% extends 'base.html' %}

{% block title %}Gerenciar Obras{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Gerenciar Obras</h2>

    <!-- Formulário de Cadastro -->
    <div class="card mb-4">
        <div class="card-header">
            Cadastrar Nova Obra
        </div>
        <div class="card-body">
            <form action="{{ url_for('gerenciar_obras') }}" method="POST">
                <div class="form-row">
                    <div class="form-group col-md-5">
                        <label for="nome">Nome da Obra</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    <div class="form-group col-md-5">
                        <label for="localizacao">Localização</label>
                        <input type="text" class="form-control" id="localizacao" name="localizacao" required>
                    </div>
                    <div class="form-group col-md-2 align-self-end">
                        <button type="submit" class="btn btn-primary w-100">Salvar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Obras -->
    <h3 class="h4 mt-5">Obras Cadastradas</h3>
    <table class="table table-striped table-hover table-responsive-cards">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Localização</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for obra in obras %}
            <tr>
                <td data-label="ID">{{ obra.id }}</td>
                <td data-label="Nome">{{ obra.nome }}</td>
                <td data-label="Localização">{{ obra.localizacao }}</td>
                <td class="actions-cell">
                    <a href="{{ url_for('editar_obra', id=obra.id) }}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i> Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
